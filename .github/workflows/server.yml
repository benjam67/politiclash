name: Serveur (Cloudflare Worker)

# Déploie le serveur du jeu (dossier server/) sur Cloudflare quand il change, puis vérifie qu'il répond.
# Il faut ces secrets du dépôt (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (modèle « Edit Cloudflare Workers »),
#   TURN_KEY_ID, TURN_KEY_API_TOKEN (Realtime → TURN Server dans le tableau de bord Cloudflare).
#   STATS_KEY (facultatif) : clé de la page privée des statistiques (france-bagarre.fr/stats.html).
# Tant qu'ils manquent, le déploiement est sauté sans erreur.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_STATS_KEY: ${{ secrets.STATS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests du serveur
        run: npx vitest run tests/unit/server.test.ts tests/unit/queue.test.ts tests/unit/stats.test.ts
      - name: Secrets absents
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Secrets Cloudflare absents dans GitHub, déploiement sauté."
      - name: Déployer
        id: deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: '4'
          secrets: |
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
      - name: Clé de la page des statistiques
        if: env.HAS_SECRETS == 'true' && env.HAS_STATS_KEY == 'true'
        working-directory: server
        run: echo "$STATS_KEY" | npx wrangler secret put STATS_KEY
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier que le serveur répond et fournit le relais
        if: env.HAS_SECRETS == 'true'
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Adresse du serveur : $URL"
          # Un nouveau sous-domaine workers.dev met quelques minutes à recevoir son certificat HTTPS : on attend.
          for i in $(seq 1 30); do
            curl -fsS "$URL/health" -o health.json && break
            echo "Pas encore joignable ($i/30), nouvel essai dans 10 s…"
            sleep 10
          done
          cat health.json
          grep -q '"turn":true' health.json
          curl -fsS -X POST -H "Origin: https://benjam67.github.io" "$URL/ice" -o ice.json
          grep -q 'turn:' ice.json && echo "Relais : accès fournis."
          # Un autre site ne doit pas pouvoir se servir du relais.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: https://ailleurs.example" "$URL/ice")
          test "$CODE" = 403 && echo "Autre site : refusé (403)." 
          node scripts/check-queue.mjs "$URL"
          curl -fsS "$URL/rank/board?period=day" | grep -q '"period":"day"' && echo "Classement : en ligne."
          # Statistiques : fiche d'un autre site refusée, lecture refusée sans la bonne clé, acceptée avec.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: https://ailleurs.example" -H "content-type: application/json" -d '{}' "$URL/stats/match")
          test "$CODE" = 403 && echo "Statistiques : fiche d'un autre site refusée."
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/stats/data?key=mauvaise")
          test "$CODE" = 403 && echo "Statistiques : mauvaise clé refusée."
          if [ -n "$STATS_KEY" ]; then
            curl -fsS "$URL/stats/data?days=1&key=$STATS_KEY" | grep -q '"rows"' && echo "Statistiques : lecture avec la clé."
          fi
          echo "### Serveur en ligne : $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
