name: Déploiement du jeu

# Build + tests, puis publication de dist/ :
#   - sur Cloudflare (Worker « france-bagarre-site », dossier site/), adresse principale du jeu ;
#   - sur la branche gh-pages (ancienne adresse GitHub Pages) : une simple page de renvoi vers france-bagarre.fr.
# Secrets Cloudflare : les mêmes que pour le serveur (CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: echo "${GITHUB_SHA}" > dist/version.txt
      - name: Publier sur Cloudflare
        id: cf
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: '4'
      - name: Vérifier la version en ligne sur Cloudflare
        if: env.HAS_CF == 'true'
        run: |
          set -x
          URL="${{ steps.cf.outputs.deployment-url }}"
          echo "Adresse : $URL"
          for i in $(seq 1 30); do
            curl -fsS "$URL/version.txt" -o v.txt && grep -q "${GITHUB_SHA}" v.txt && break
            echo "Pas encore à jour ($i/30), nouvel essai dans 10 s…"
            sleep 10
          done
          grep -q "${GITHUB_SHA}" v.txt
          curl -fsS "$URL/" | grep -q "<title>France Bagarre</title>"
          echo "### Jeu en ligne : $URL" >> "$GITHUB_STEP_SUMMARY"
          # Le domaine : vérifié aussi (certificat créé par Cloudflare au premier déploiement, d'où l'attente).
          for i in $(seq 1 30); do
            curl -fsS "https://france-bagarre.fr/version.txt" -o d.txt && grep -q "${GITHUB_SHA}" d.txt && break
            echo "Domaine pas encore prêt ($i/30), nouvel essai dans 10 s…"
            sleep 10
          done
          grep -q "${GITHUB_SHA}" d.txt
          # Aperçu des liens partagés et icône d'onglet.
          curl -fsSI "https://france-bagarre.fr/share.jpg" | grep -qi "content-type: image/jpeg"
          curl -fsS "https://france-bagarre.fr/" | grep -q 'og:image" content="https://france-bagarre.fr/share.jpg"'
          curl -fsSI "https://france-bagarre.fr/favicon.ico" | grep -qi "^HTTP/.* 200"
          # Page vie privée : Cloudflare masque les adresses mail aux robots (Email Address Obfuscation) ;
          # le navigateur les réaffiche. On accepte l'adresse en clair ou masquée.
          curl -fsS "https://france-bagarre.fr/vie-privee.html" | grep -q -e "baffe@france-bagarre.fr" -e "email-protection"
          curl -fsS "https://france-bagarre.fr/vie-privee.html" | grep -q "Vie privée et mentions légales"
          # Mesure d'audience (Cloudflare Web Analytics, code dans index.html) : toujours dans la page ?
          if curl -fsS -A "Mozilla/5.0 (verification deploiement)" "https://france-bagarre.fr/" | grep -q "cloudflareinsights"; then
            echo "Mesure d'audience : présente." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Mesure d'audience absente de la page (Web Analytics)."
          fi
          echo "### Domaine : https://france-bagarre.fr" >> "$GITHUB_STEP_SUMMARY"
      - name: Publier sur gh-pages la page de renvoi vers france-bagarre.fr
        # L'ancienne adresse (benjam67.github.io/politiclash/) renvoie vers le domaine, en gardant
        # le code de salon des liens d'invitation déjà partagés.
        run: |
          mkdir -p redirect && cd redirect
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8"><title>France Bagarre</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://france-bagarre.fr/">
          <script>location.replace('https://france-bagarre.fr/' + location.search + location.hash);</script>
          <meta http-equiv="refresh" content="0; url=https://france-bagarre.fr/">
          </head><body><p>France Bagarre a déménagé : <a href="https://france-bagarre.fr/">france-bagarre.fr</a></p></body></html>
          HTML
          cp index.html 404.html
          touch .nojekyll
          echo "${GITHUB_SHA}" > version.txt
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Renvoi vers france-bagarre.fr (${GITHUB_SHA})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
