<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#002654" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="France Bagarre" />
    <title>France Bagarre</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1020;
        --yellow: #ffc93c;
        --red: #e8304a;
        --pink: #ff3d8b;
        --cyan: #35c8f0;
        --cream: #fff7e8;
        /* Drapeau tricolore actuel (bleu marine) */
        --fblue: #002654;
        --fwhite: #ffffff;
        --fred: #ce1126;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        /* iPhone : la hauteur réelle visible, barres de Safari comprises. */
        height: 100dvh;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--ink);
        color: var(--cream);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-weight: 800;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      #rotate .title {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 30px;
        color: var(--fwhite);
        transform: rotate(-4deg);
        text-shadow: 3px 3px 0 var(--red);
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 6px solid var(--cream);
        border-radius: 12px;
        animation: tilt 1.8s ease-in-out infinite;
      }
      #rotate p {
        margin: 0;
        font-size: 18px;
      }
      /* ── Jeu en ligne : menu et salon (HTML pour profiter du clavier du téléphone) ── */
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(26, 16, 32, 0.84);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        color: var(--cream);
        touch-action: manipulation;
      }
      #lobby[hidden] {
        display: none;
      }
      #lobby .panel {
        position: relative;
        width: min(92vw, 560px);
        max-height: 94vh;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px 18px 14px;
        background: var(--fblue);
        border: 5px solid var(--fwhite);
        box-shadow: 8px 8px 0 var(--fred);
        transform: rotate(-1deg);
        text-align: center;
      }
      #lobby .ttl {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 26px;
        color: var(--fwhite);
        text-shadow: 3px 3px 0 var(--fred);
        margin-bottom: 4px;
      }
      #lobby [data-view] {
        display: none;
      }
      #lobby[data-show='choice'] [data-view='choice'],
      #lobby[data-show='host'] [data-view='host'],
      #lobby[data-show='join'] [data-view='join'],
      #lobby[data-show='busy'] [data-view='busy'] {
        display: block;
      }
      #lobby p {
        margin: 5px 0;
        font-weight: 800;
        font-size: 15px;
      }
      #lobby .row {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      #lobby .mode {
        border-top: 2px dashed rgba(255, 247, 232, 0.25);
        margin-top: 6px;
        padding-top: 4px;
      }
      #lobby .mode h3 {
        margin: 2px 0 0;
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-weight: 400;
        font-size: 17px;
        color: var(--fwhite);
      }
      #lobby .mode.soon {
        opacity: 0.5;
      }
      #lobby button {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 17px;
        color: var(--fblue);
        background: var(--fwhite);
        border: 5px solid var(--ink);
        outline: 3px solid var(--fred);
        padding: 8px 14px;
        margin: 5px 0;
        transform: rotate(-2deg);
        cursor: pointer;
        touch-action: manipulation;
      }
      #lobby button:active {
        transform: rotate(-2deg) scale(0.95);
      }
      #lobby button.alt {
        color: var(--fwhite);
        background: var(--fred);
      }
      #lobby button.back {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 12px;
        background: var(--cream);
        padding: 4px 9px;
        outline: none;
        border-width: 3px;
        margin: 0;
      }
      #lobby label {
        font-weight: 800;
        font-size: 14px;
      }
      #lobby #lobby-pseudo {
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-weight: 800;
        font-size: 18px;
        width: 9em;
        padding: 3px 8px;
        color: var(--ink);
        background: var(--cream);
        border: 4px solid var(--fred);
        -webkit-user-select: text;
        user-select: text;
      }
      #lobby .code {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 54px;
        line-height: 1.1;
        letter-spacing: 10px;
        color: var(--cream);
        text-shadow: 4px 4px 0 var(--fred);
        -webkit-user-select: text;
        user-select: text;
      }
      #lobby #lobby-code {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 38px;
        width: 5.2em;
        text-align: center;
        letter-spacing: 8px;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--cream);
        border: 5px solid var(--fred);
        padding: 2px 0 2px 8px;
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }
      #lobby .status {
        min-height: 20px;
        color: var(--fwhite);
      }
      #lobby .status.err {
        color: var(--pink);
      }
      @keyframes tilt {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="lobby" hidden data-show="choice">
      <div class="panel">
        <button data-act="back" class="back">← RETOUR</button>
        <div class="ttl" data-text="menuTitle"></div>
        <div data-view="choice">
          <div class="row">
            <label for="lobby-pseudo" data-text="pseudoLabel"></label>
            <input id="lobby-pseudo" maxlength="14" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          </div>
          <div class="mode">
            <h3 data-text="friends"></h3>
            <p data-status data-text="friendsHelp"></p>
            <div class="row">
              <button data-act="create" data-text="create"></button>
              <button data-act="join" class="alt" data-text="join"></button>
            </div>
          </div>
          <div class="mode soon">
            <h3 data-text="quick"></h3>
            <p data-text="quickSoon"></p>
          </div>
        </div>
        <div data-view="host">
          <p data-text="friends"></p>
          <div class="code" id="lobby-code-show">····</div>
          <div class="row"><button data-act="share" class="alt" data-text="share"></button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="join">
          <p data-text="codeHelp"></p>
          <input id="lobby-code" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go" aria-label="Code du salon" />
          <div class="row"><button data-act="go" data-text="go"></button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="busy">
          <p class="status" data-status></p>
        </div>
      </div>
    </div>
    <div id="rotate" role="alert">
      <div class="title">FRANCE BAGARRE</div>
      <div class="phone" aria-hidden="true"></div>
      <p>Tourne ton téléphone<br />pour en mettre une !</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
