<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#002654" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="France Bagarre" />
    <title>France Bagarre</title>
    <script>
      // www.france-bagarre.fr → france-bagarre.fr : une seule adresse, donc une seule sauvegarde par joueur.
      if (location.hostname.indexOf('www.') === 0) location.replace(location.href.replace('//www.', '//'));
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="description" content="Tous les coups sont permis pour entrer à l’Élysée." />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <!-- Aperçu des liens partagés (WhatsApp, Messages, réseaux). Adresses complètes obligatoires. Image : npm run share. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="France Bagarre" />
    <meta property="og:title" content="France Bagarre" />
    <meta property="og:description" content="Tous les coups sont permis pour entrer à l’Élysée." />
    <meta property="og:url" content="https://france-bagarre.fr/" />
    <meta property="og:image" content="https://france-bagarre.fr/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="France Bagarre : six candidats caricaturés en garde dans l’hémicycle" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1020;
        --yellow: #ffc93c;
        --red: #e8304a;
        --pink: #ff3d8b;
        --cyan: #35c8f0;
        --cream: #fff7e8;
        /* Drapeau tricolore actuel (bleu marine) */
        --fblue: #002654;
        --fwhite: #ffffff;
        --fred: #ce1126;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        /* iPhone : la hauteur réelle visible, barres de Safari comprises. */
        height: 100dvh;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--fblue);
        color: var(--cream);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-weight: 800;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      #rotate .logo {
        width: min(72vw, 300px);
        height: auto;
        border: 4px solid var(--fwhite);
        border-radius: 6px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      #rotate .title {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 30px;
        color: var(--fwhite);
        transform: rotate(-4deg);
        text-shadow: 3px 3px 0 var(--red);
      }
      #rotate .phone {
        width: 54px;
        height: 92px;
        border: 6px solid var(--cream);
        border-radius: 12px;
        animation: tilt 1.8s ease-in-out infinite;
      }
      #rotate p {
        margin: 0;
        font-size: 18px;
      }
      /* ── Jeu en ligne : menu et salon (HTML pour profiter du clavier du téléphone) ── */
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(26, 16, 32, 0.84);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        color: var(--cream);
        touch-action: manipulation;
      }
      #lobby[hidden] {
        display: none;
      }
      #lobby .panel {
        position: relative;
        width: min(92vw, 560px);
        max-height: 94vh;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px 18px 14px;
        background: var(--fblue);
        border: 5px solid var(--fwhite);
        box-shadow: 8px 8px 0 var(--fred);
        transform: rotate(-1deg);
        text-align: center;
      }
      #lobby .ttl {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 26px;
        color: var(--fwhite);
        text-shadow: 3px 3px 0 var(--fred);
        margin-bottom: 4px;
      }
      #lobby [data-view] {
        display: none;
      }
      #lobby[data-show='choice'] [data-view='choice'],
      #lobby[data-show='host'] [data-view='host'],
      #lobby[data-show='join'] [data-view='join'],
      #lobby[data-show='busy'] [data-view='busy'] {
        display: block;
      }
      #lobby p {
        margin: 5px 0;
        font-weight: 800;
        font-size: 15px;
      }
      #lobby .row {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      #lobby .mode {
        border-top: 2px dashed rgba(255, 247, 232, 0.25);
        margin-top: 6px;
        padding-top: 4px;
      }
      #lobby .mode h3 {
        margin: 2px 0 0;
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-weight: 400;
        font-size: 17px;
        color: var(--fwhite);
      }
      #lobby .mode.soon {
        opacity: 0.5;
      }
      #lobby button {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 17px;
        color: var(--fblue);
        background: var(--fwhite);
        border: 5px solid var(--ink);
        outline: 3px solid var(--fred);
        padding: 8px 14px;
        margin: 5px 0;
        transform: rotate(-2deg);
        cursor: pointer;
        touch-action: manipulation;
      }
      #lobby button:active {
        transform: rotate(-2deg) scale(0.95);
      }
      #lobby button.alt {
        color: var(--fwhite);
        background: var(--fred);
      }
      #lobby button.back {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 12px;
        background: var(--cream);
        padding: 4px 9px;
        outline: none;
        border-width: 3px;
        margin: 0;
      }
      #lobby label {
        font-weight: 800;
        font-size: 14px;
      }
      #lobby #lobby-pseudo {
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-weight: 800;
        font-size: 18px;
        width: 9em;
        padding: 3px 8px;
        color: var(--ink);
        background: var(--cream);
        border: 4px solid var(--fred);
        -webkit-user-select: text;
        user-select: text;
      }
      #lobby .code {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 54px;
        line-height: 1.1;
        letter-spacing: 10px;
        color: var(--cream);
        text-shadow: 4px 4px 0 var(--fred);
        -webkit-user-select: text;
        user-select: text;
      }
      #lobby #lobby-code {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 38px;
        width: 5.2em;
        text-align: center;
        letter-spacing: 8px;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--cream);
        border: 5px solid var(--fred);
        padding: 2px 0 2px 8px;
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }
      #lobby .status {
        min-height: 20px;
        color: var(--fwhite);
      }
      #lobby .status.err {
        color: var(--pink);
      }
      #lobby .status .trace {
        display: inline-block;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 247, 232, 0.6);
        -webkit-user-select: text;
        user-select: text;
      }
      /* ── Classement (HTML : la liste de 100 défile bien sur téléphone) ── */
      #ranking {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(26, 16, 32, 0.88);
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        color: var(--cream);
      }
      #ranking[hidden] {
        display: none;
      }
      #ranking .panel {
        position: relative;
        width: min(94vw, 620px);
        height: min(94vh, 560px);
        box-sizing: border-box;
        padding: 10px 16px 12px;
        display: flex;
        flex-direction: column;
        background: #002654;
        border: 5px solid #ffffff;
        box-shadow: 8px 8px 0 #ce1126;
      }
      #ranking .ttl {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 24px;
        text-align: center;
        color: #ffffff;
        text-shadow: 3px 3px 0 #ce1126;
      }
      #ranking .help,
      #ranking .me {
        margin: 2px 0;
        text-align: center;
        font-weight: 800;
        font-size: 13px;
      }
      #ranking .me {
        color: var(--yellow);
      }
      #ranking .tabs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 4px 0;
      }
      #ranking button {
        font-family: 'Dela Gothic One', system-ui, sans-serif;
        font-size: 14px;
        color: #002654;
        background: #ffffff;
        border: 3px solid #1a1020;
        padding: 4px 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      #ranking .tabs button[aria-selected='true'] {
        background: #ce1126;
        color: #ffffff;
      }
      #ranking button.back {
        position: absolute;
        left: 10px;
        top: 8px;
        font-size: 12px;
        padding: 3px 8px;
      }
      #ranking ol {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
      }
      #ranking li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        font-weight: 800;
        font-size: 15px;
      }
      #ranking li.mine {
        background: rgba(255, 201, 60, 0.18);
      }
      #ranking li .r {
        width: 2.4em;
        text-align: right;
        color: var(--yellow);
      }
      #ranking li .n {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #ranking li .w {
        font-weight: 600;
        font-size: 13px;
      }
      #ranking li .flag {
        font-family: 'M PLUS 1p', system-ui, sans-serif;
        font-size: 11px;
        padding: 1px 6px;
        border-width: 2px;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        border-color: rgba(255, 255, 255, 0.3);
      }
      #ranking li.empty {
        justify-content: center;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.7);
      }
      @keyframes tilt {
        0%, 20% { transform: rotate(0deg); }
        55%, 80% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      #rotate .hint {
        font-size: 13px;
        font-weight: 500;
        opacity: 0.8;
        max-width: 280px;
      }
      /* L'orientation est décidée par le script ci-dessous (plus fiable que la règle CSS sur iPhone).
         Sans script, on garde la règle CSS en secours. */
      html:not(.orient-js) #rotate {
        display: none;
      }
      @media (orientation: portrait) {
        html:not(.orient-js) #rotate {
          display: flex;
        }
      }
      html.is-portrait #rotate {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="lobby" hidden data-show="choice">
      <div class="panel">
        <button data-act="back" class="back">← RETOUR</button>
        <div class="ttl" data-text="menuTitle"></div>
        <div data-view="choice">
          <div class="row">
            <label for="lobby-pseudo" data-text="pseudoLabel"></label>
            <input id="lobby-pseudo" maxlength="14" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />
          </div>
          <div class="mode">
            <h3 data-text="friends"></h3>
            <p data-status data-text="friendsHelp"></p>
            <div class="row">
              <button data-act="create" data-text="create"></button>
              <button data-act="join" class="alt" data-text="join"></button>
            </div>
          </div>
          <div class="mode">
            <h3 data-text="quick"></h3>
            <p data-text="quickHelp"></p>
            <div class="row"><button data-act="quick" data-text="quickGo"></button><button data-act="ranking" class="alt" data-rank-text="open"></button></div>
          </div>
        </div>
        <div data-view="host">
          <p data-text="friends"></p>
          <div class="code" id="lobby-code-show">····</div>
          <div class="row"><button data-act="share" class="alt" data-text="share"></button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="join">
          <p data-text="codeHelp"></p>
          <input id="lobby-code" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go" aria-label="Code du salon" />
          <div class="row"><button data-act="go" data-text="go"></button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="busy">
          <p class="status" data-status></p>
        </div>
      </div>
    </div>
    <div id="ranking" hidden>
      <div class="panel">
        <button data-act="close" class="back" data-rank-text="close"></button>
        <div class="ttl" data-rank-text="title"></div>
        <p class="help" data-rank-text="help"></p>
        <div class="tabs">
          <button data-period="day"></button>
          <button data-period="week"></button>
          <button data-period="all"></button>
        </div>
        <p class="me" id="ranking-me"></p>
        <ol id="ranking-list"></ol>
      </div>
    </div>
    <div id="rotate" role="alert">
      <img class="logo" src="assets/ui/logo.webp" alt="" width="424" height="178" />
      <div class="title">FRANCE BAGARRE</div>
      <div class="phone" aria-hidden="true"></div>
      <p>Tourne ton téléphone<br />pour en mettre une !</p>
      <p class="hint">Rien ne bouge ? Sur iPhone, ouvre le centre de contrôle et coupe le verrou de rotation (le cadenas).</p>
    </div>
    <script>
      // Portrait ou paysage ? On compare la largeur et la hauteur visibles, et on revérifie un peu
      // après chaque rotation : sur iPhone, les mesures arrivent parfois en retard.
      (function () {
        var root = document.documentElement;
        root.classList.add('orient-js');
        var check = function () {
          var w = window.innerWidth || root.clientWidth;
          var h = window.innerHeight || root.clientHeight;
          root.classList.toggle('is-portrait', h > w);
        };
        var later = function () {
          check();
          [100, 300, 700].forEach(function (ms) { setTimeout(check, ms); });
        };
        check();
        window.addEventListener('resize', later);
        window.addEventListener('orientationchange', later);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
        if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', later);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
