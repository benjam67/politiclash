nt-family:Dela Gothic One,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:26px}#lobby [data-view]{display:none}#lobby[data-show=choice] [data-view=choice],#lobby[data-show=host] [data-view=host],#lobby[data-show=join] [data-view=join],#lobby[data-show=busy] [data-view=busy]{display:block}#lobby p{margin:5px 0;font-size:15px;font-weight:800}#lobby .row{flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;display:flex}#lobby .mode{border-top:2px dashed #fff7e840;margin-top:6px;padding-top:4px}#lobby .mode h3{color:var(--fwhite);margin:2px 0 0;font-family:Dela Gothic One,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:17px;font-weight:400}#lobby .mode.soon{opacity:.5}#lobby button{color:var(--fblue);background:var(--fwhite);border:5px solid var(--ink);outline:3px solid var(--fred);cursor:pointer;touch-action:manipulation;margin:5px 0;padding:8px 14px;font-family:Dela Gothic One,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:17px;transform:rotate(-2deg)}#lobby button:active{transform:rotate(-2deg)scale(.95)}#lobby button.alt{color:var(--fwhite);background:var(--fred)}#lobby button.back{background:var(--cream);border-width:3px;outline:none;margin:0;padding:4px 9px;font-size:12px;position:absolute;top:8px;left:10px}#lobby label{font-size:14px;font-weight:800}#lobby #lobby-pseudo{width:9em;color:var(--ink);background:var(--cream);border:4px solid var(--fred);-webkit-user-select:text;user-select:text;padding:3px 8px;font-family:"M PLUS 1p",system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;font-size:18px;font-weight:800}#lobby .code{letter-spacing:10px;color:var(--cream);text-shadow:4px 4px 0 var(--fred);-webkit-user-select:text;user-select:text;font-family:Dela Gothic One,system-ui   <body>
    <div id="game"></div>
    <div id="lobby" hidden data-show="choice">
      <div class="panel">
        <button data-act="back" class="back">← RETOUR</button>
        <div class="ttl" data-text="menuTitle"></div>
        <div data-view="choice">
          <div class="row">
            <label for="lobby-pseudo" data-text="pseudoLabel"></label>
            <input id="lobby-pseudo" maxlength="14" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" />

          <div class="mode">
            <h3 data-text="friends"></h3>
            <p data-status data-text="friendsHelp"></p>
            <div class="row">
              <button data-act="create" data-text="create"></button>
              <button data-act="join" class="alt" data-text="join"></button>
            </div>
          </div>
          <div class="mode soon">
            <h3 data-text="quick"></h3>
            <p data-text="quickSoon"></p>
          </div>
        </div>
        <div data-view="host">
          <p data-text="friends"></p>
          <div class="code" id="lobby-code-show">····</div>
          <div class="row"><button data-act="share" class="alt" data-text="share"></button></div>
          <p class="status" data-status></p>
        </div>
        <div data-view="join">

    <div id="rotate" role="alert">
      <img class="logo" src="assets/ui/logo.webp" alt="" width="424" height="178" />
      <div class="title">FRANCE BAGARRE</div>
      <div class="phone" aria-hidden="true"></div>
      <p>Tourne ton téléphone<br />pour en mettre une !</p>
      <p class="hint">Rien ne bouge ? Sur iPhone, ouvre le centre de contrôle et coupe le verrou de rotation (le cadenas).</p>
    </div>
    <script>
      // Portrait ou paysage ? On compare la largeur et la hauteur visibles, et on revérifie un peu
      // après chaque rotation : sur iPhone, les mesures arrivent parfois en retard.
      (function () {
        var root = document.documentElement;
        root.classList.add('orient-js');
        var check = function () {
          var w = window.innerWidth || root.clientWidth;
          var h = window.innerHeight || root.clientHeight;
          root.classList.toggle('is-portrait', h > w);
        };
        var later = function () {
          check();
          [100, 300, 700].forEach(function (ms) { setTimeout(check, ms); });
        };
        check();
        window.addEventListener('resize', later);
        window.addEventListener('orientationchange', later);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', later);
        if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', later);
      })();
    </script>
